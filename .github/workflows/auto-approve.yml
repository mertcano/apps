name: bot

on:
  pull_request:
    types: [labeled]

# Least privilege: default GITHUB_TOKEN permissions scoped to read-only.
# A dedicated PAT (GH_PAT_BOT) is provided directly to the approval action.
permissions:
  contents: read

jobs:
  approve:
    # 1. Ensure the pull request originates from the same repository (prevents
    #    untrusted code in fork PRs from being auto-approved with a privileged token).
    # 2. Check the PR title for the '[CI Skip]' escape hatch, since head_commit
    #    is null on pull_request events.
    if: "github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.title, '[CI Skip]')"
    runs-on: ubuntu-latest
    steps:
      - name: Auto approve PR
        uses: jacogr/action-approve@795afd1dd096a2071d7ec98740661af4e853b7da # master
        with:
          authors: jacogr, TarikGul
          labels: -auto
          token: ${{ secrets.GH_PAT_BOT }}
